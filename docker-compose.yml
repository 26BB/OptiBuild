version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: optibuild_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: optibuild
      POSTGRES_PASSWORD: optibuild_secret
      POSTGRES_DB: optibuild_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optibuild -d optibuild_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: optibuild_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: optibuild_minio_admin
      MINIO_ROOT_PASSWORD: optibuild_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: optibuild_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://optibuild:optibuild_secret@postgres:5432/optibuild_db
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: optibuild_minio_admin
      S3_SECRET_KEY: optibuild_minio_secret
      S3_BUCKET_NAME: optibuild-artifacts
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: optibuild_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
